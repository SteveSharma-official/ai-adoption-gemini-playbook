# Runs every lab's proof sequence. Read-only.
# Status: EXECUTION VALIDATION REQUIRED (not yet run on a hosted runner).
# Before publication: pin each action to a full commit SHA and verify the versions.
name: validate-labs
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 21 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python shared/scripts/generate_datasets.py && git diff --exit-code shared/datasets
      - run: python -m pytest -q
